<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naya — Ton intelligence stratégique</title>
    <!-- Anti-flash : applique le thème avant le premier paint -->
    <script>
      (function() {
        // Pas de mode sombre : la classe dark n'est jamais posée.
        try { if (localStorage.getItem('naya-theme') === 'dark') localStorage.removeItem('naya-theme'); } catch (e) {}
        document.documentElement.classList.remove('dark');
      })();
    </script>

    <!-- Naya Typography : Lora 500 (accueil) + Nunito Sans 400/600 (partout ailleurs) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
